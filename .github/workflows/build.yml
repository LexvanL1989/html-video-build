name: Build encrypted HTML video
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build phase
        required: true
        default: review
        type: choice
        options: [review, render]
permissions:
  contents: write
concurrency:
  group: html-video-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      DO_NOT_TRACK: '1'
      HYPERFRAMES_TELEMETRY_DISABLED: '1'
      RENDER_KEY: ${{ secrets.RENDER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 > /tmp/dependencies.log 2>&1
          npm install --no-audit --no-fund
      - name: Build and verify
        run: node build.mjs ${{ inputs.phase }}
      - name: Return encrypted result without artifact storage
        if: always()
        run: |
          test -f output.enc
          test "$(stat -c%s output.enc)" -lt 90000000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan result-${{ github.run_id }}
          git rm -rf --cached .
          git add -f output.enc
          git commit -m 'Encrypted build result'
          git push origin HEAD:refs/heads/result-${{ github.run_id }}
