name: Build encrypted HTML video
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build phase
        required: true
        default: review
        type: choice
        options: [review, render]
permissions:
  contents: write
concurrency:
  group: html-video-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      DO_NOT_TRACK: '1'
      HYPERFRAMES_TELEMETRY_DISABLED: '1'
      RENDER_KEY: ${{ secrets.RENDER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free build dependencies
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/media-tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 90 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64 -o "$RUNNER_TEMP/media-tools/ffmpeg"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 90 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64 -o "$RUNNER_TEMP/media-tools/ffprobe"
          cd "$RUNNER_TEMP/media-tools"
          echo "e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  ffmpeg" | sha256sum -c -
          echo "4f231a1960d83e403d08f7971e271707bec278a9ae18e21b8b5b03186668450d  ffprobe" | sha256sum -c -
          chmod +x ffmpeg ffprobe
          echo "$RUNNER_TEMP/media-tools" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          command -v google-chrome || command -v chromium
          npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
      - name: Build and verify
        run: node build.mjs ${{ inputs.phase }}
      - name: Return encrypted result without artifact storage
        if: always()
        run: |
          test -f output.enc
          test "$(stat -c%s output.enc)" -lt 90000000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan result-${{ github.run_id }}
          git rm -rf --cached .
          git add -f output.enc
          git commit -m 'Encrypted build result'
          git push origin HEAD:refs/heads/result-${{ github.run_id }}
