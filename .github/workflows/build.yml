name: Build encrypted HTML video
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build phase
        required: true
        default: review
        type: choice
        options: [review, render]
permissions:
  contents: write
concurrency:
  group: html-video-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      DO_NOT_TRACK: '1'
      HYPERFRAMES_TELEMETRY_DISABLED: '1'
      RENDER_KEY: ${{ secrets.RENDER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free build dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg || {
              sudo timeout 90 apt-get -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=sources.list.d -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update -qq
              sudo timeout 90 apt-get -o Acquire::Retries=1 install -y -qq ffmpeg
            }
          fi
          command -v ffmpeg
          command -v google-chrome || command -v chromium
          npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000
      - name: Build and verify
        run: node build.mjs ${{ inputs.phase }}
      - name: Return encrypted result without artifact storage
        if: always()
        run: |
          test -f output.enc
          test "$(stat -c%s output.enc)" -lt 90000000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan result-${{ github.run_id }}
          git rm -rf --cached .
          git add -f output.enc
          git commit -m 'Encrypted build result'
          git push origin HEAD:refs/heads/result-${{ github.run_id }}
